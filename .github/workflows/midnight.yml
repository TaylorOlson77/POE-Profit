name: Midnight

# Phone viewports, then visual baselines. The mutation job scores on Sunday
# and on a manual run, then posts that score as a commit status. A score under
# 90 fails that job. k6 is a later job.
# A pull request does not run it.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      update_visual_baselines:
        description: Write new visual screenshots instead of comparing
        type: boolean
        default: false

jobs:
  phone:
    name: Phone viewports
    # Playwright 1.55.0 has no Chromium build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One shared Neon `ci` branch. Queue with the pull-request Playwright job.
    concurrency:
      group: e2e-ci-database
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL_UNPOOLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Migrate and reset CI database
        run: |
          npx prisma migrate deploy
          npx tsx prisma/reset-to-seed.ts
        env:
          CI: true
          DATABASE_RESET: ci

      - name: Production build
        run: npm run build

      - name: Phone viewport tests
        run: npm run test:e2e:phone

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-phone-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  visual:
    name: Visual baselines
    needs: phone
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: e2e-ci-database
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL_UNPOOLED }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Migrate and reset CI database
        run: |
          npx prisma migrate deploy
          npx tsx prisma/reset-to-seed.ts
        env:
          CI: true
          DATABASE_RESET: ci

      - name: Production build
        run: npm run build

      - name: Compare pages to saved screenshots
        if: ${{ !inputs.update_visual_baselines }}
        run: npm run test:e2e:visual

      - name: Update visual baselines
        if: ${{ inputs.update_visual_baselines }}
        run: npm run test:e2e:visual -- --update-snapshots

      - name: Upload updated baselines
        if: ${{ inputs.update_visual_baselines && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines
          path: e2e/**/*-snapshots/**
          retention-days: 7
          if-no-files-found: error

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-visual-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    name: Mutation score
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decide whether to score
        id: when
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u +%u)" = "7" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Mutation score
        id: score
        if: steps.when.outputs.run == 'true'
        shell: bash
        run: |
          set +e
          set +o pipefail
          npm run test:mutation 2>&1 | tee mutation-log.txt
          code=${PIPESTATUS[0]}
          node scripts/read-mutation-log.mjs mutation-log.txt >> "$GITHUB_OUTPUT"
          parse=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$parse" -ne 0 ]; then
            exit "$parse"
          fi
          exit "$code"

      - name: Publish mutation score
        if: always() && steps.when.outputs.run == 'true' && steps.score.outputs.score != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ steps.score.outputs.exit_code }}" = "0" ]; then
            state=success
          else
            state=failure
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$state" \
            -f context="mutation" \
            -f description="score=${{ steps.score.outputs.score }} killed=${{ steps.score.outputs.killed }} survived=${{ steps.score.outputs.survived }}" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Upload mutation report
        if: steps.when.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 7
          if-no-files-found: error
