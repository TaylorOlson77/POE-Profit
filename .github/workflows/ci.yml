name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit, API, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm test

      - name: API tests (Jest)
        run: npm run test:api

      - name: Production build
        run: npm run build

  e2e:
    name: Playwright E2E
    needs: quality
    # Playwright 1.55.0 has no Chromium build for Ubuntu 26.04 (ubuntu-latest).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One shared Neon `ci` branch. Queue runs so two jobs cannot wipe it at once.
    concurrency:
      group: e2e-ci-database
      cancel-in-progress: false
    env:
      DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL_UNPOOLED }}
    outputs:
      pages-artifact: ${{ steps.playwright-pages.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Migrate and reset CI database
        run: |
          npx prisma migrate deploy
          npx tsx prisma/reset-to-seed.ts
        env:
          CI: true
          DATABASE_RESET: ci

      - name: API persistence
        run: npm run test:api:db

      - name: Reset CI database before Playwright
        run: npx tsx prisma/reset-to-seed.ts
        env:
          CI: true
          DATABASE_RESET: ci

      - name: Production build
        run: npm run build

      - name: E2E tests (Playwright)
        id: playwright
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright report
        id: playwright-pages
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (steps.playwright.outcome == 'success' || steps.playwright.outcome == 'failure') }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report

  deploy-report:
    name: Publish Playwright report
    needs: e2e
    if: ${{ always() && needs.e2e.outputs.pages-artifact == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
