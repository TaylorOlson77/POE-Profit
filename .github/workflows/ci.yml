name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit, API, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (Jest)
        run: npm test

      - name: API tests (Jest)
        run: npm run test:api

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # F1: create repository variable E2E_DATABASE=1 and secrets
      # CI_DATABASE_URL / CI_DATABASE_URL_UNPOOLED for a dedicated Neon
      # database (not the public demo). This step then migrates and seeds
      # it, and the journey specs stop skipping.
      - name: Migrate and seed E2E database
        if: vars.E2E_DATABASE == '1'
        run: |
          npx prisma migrate deploy
          npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL_UNPOOLED }}

      - name: E2E tests (Playwright)
        run: npm run test:e2e
        env:
          CI: true
          E2E_DATABASE: ${{ vars.E2E_DATABASE }}
          DATABASE_URL: ${{ secrets.CI_DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.CI_DATABASE_URL_UNPOOLED }}

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
